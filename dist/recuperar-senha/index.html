<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recuperar senha — Atlas</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/account.css?v=3.0.0"></head><body><main class="account-page"><section class="account-story"><a class="brand" href="/"><img src="/atlas-logo.svg" alt="Atlas"></a><div class="story-copy"><span>RECUPERAÇÃO SEGURA</span><h1>Perder a senha não precisa virar operação de risco.</h1><p>Informe o e-mail cadastrado e enviaremos as instruções para criar uma nova senha.</p></div></section><section class="account-panel"><form class="form-card" id="resetRequest"><h2>Recuperar senha</h2><p>O link expira e só pode ser usado uma vez.</p><div class="field"><label for="email">E-mail</label><input id="email" type="email" autocomplete="email" required></div><button class="submit" type="submit">Enviar instruções</button><div class="status" id="status"></div><div class="form-row"><a href="/acesso">Voltar ao login</a></div></form></section></main><script type="module">const form=document.querySelector('#resetRequest'),status=document.querySelector('#status');form.addEventListener('submit',async e=>{e.preventDefault();const b=form.querySelector('button');b.disabled=true;try{const r=await fetch('/api/password-reset-request',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value})}),p=await r.json();status.textContent=p.message||p.error;status.className='status '+(r.ok?'success':'error')}catch{status.textContent='Não foi possível enviar agora.';status.className='status error'}finally{b.disabled=false}})</script></body></html>
